name: Nightly upstream sync

on:
  schedule:
    # 22:17 UTC = 06:17 Asia/Shanghai on the following calendar day.
    # Keep the minute off the hour: GitHub cron fires on top-of-hour stampedes
    # with noticeable delay.
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      preset:
        description: '打包环境（透传给 windows-package.yml）'
        type: choice
        options: [test, production]
        default: test
        required: true
      signing:
        description: '签名方式（unsigned 仅供内部调试）'
        type: choice
        options: [unsigned, signed]
        default: unsigned
        required: true
      update_channel:
        description: '升级通道'
        type: choice
        options: [nightly, stable]
        default: nightly
        required: true
      compression_level:
        description: '安装器压缩等级（透传给 windows-package.yml）'
        type: choice
        options: ['3', '7']
        default: '7'
        required: true

concurrency:
  group: nightly-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

env:
  UPSTREAM_URL: https://github.com/deepseek-ai/deepseek-harness.git

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0
          # A PAT, not the default GITHUB_TOKEN: pushes made with the default
          # token do not trigger push-based workflows such as "CI master".
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v5.0.0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream master
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream --prune --tags

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已包含上游全部提交，无需合并"
            exit 0
          fi

          if ! git merge --no-edit upstream/master; then
            echo "检测到冲突，先尝试可机械化处理的文件"
            {
              echo "### 上游合并冲突"
              echo ""
              echo "冲突文件："
              git diff --name-only --diff-filter=U | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"

            # Lockfile conflicts are mechanical: take upstream's file, then
            # regenerate it against this fork's manifests.
            if git diff --name-only --diff-filter=U | grep -qx 'pnpm-lock.yaml'; then
              git checkout --theirs -- pnpm-lock.yaml
              pnpm install --lockfile-only || true
              git add pnpm-lock.yaml
            fi

            # Anything still conflicted is source-level and needs a human.
            # Never pick a side automatically: a semantic conflict resolved
            # by "ours"/"theirs" fails silently later.
            remaining=$(git diff --name-only --diff-filter=U || true)
            if [ -n "$remaining" ]; then
              echo "::error::无法自动解决冲突，已放弃合并: $remaining"
              git merge --abort
              exit 1
            fi
            git commit --no-edit
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push master
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push origin master || {
            # Someone else pushed while this run was merging; replay once.
            git fetch origin master
            git merge --no-edit origin/master
            git push origin master
          }

  package:
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      PACKAGE_PRESET: ${{ inputs.preset || 'test' }}
      PACKAGE_SIGNING: ${{ inputs.signing || 'unsigned' }}
      PACKAGE_CHANNEL: ${{ inputs.update_channel || 'nightly' }}
      PACKAGE_COMPRESSION: ${{ inputs.compression_level || '7' }}
    steps:
      - name: Dispatch Windows packaging
        run: |
          set -euo pipefail
          gh workflow run windows-package.yml \
            --repo "$GITHUB_REPOSITORY" --ref master \
            -f source_ref=master \
            -f preset="$PACKAGE_PRESET" \
            -f update_channel="$PACKAGE_CHANNEL" \
            -f version_mode=default \
            -f compression_level="$PACKAGE_COMPRESSION" \
            -f signing="$PACKAGE_SIGNING"

      - name: Wait for packaging result
        run: |
          set -euo pipefail
          sleep 15
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow windows-package.yml --event workflow_dispatch \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "packaging run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

  notify:
    needs: [sync, package]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Report failure as an issue
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          title="Nightly upstream sync failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')
          body="失败运行：$run_url"$'\n\n'"请检查 sync / package 哪个环节失败；若是合并冲突，需要人工解决。"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body "$body"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
